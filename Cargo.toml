[package]
name = "tuxedo"
version = "2026.10.2"
edition = "2024"
description = "Keyboard-driven todo.txt TUI with nested subtasks — a community fork of Tuxedo"
repository = "https://github.com/Caracolaracol/tuxedo-task"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4.44"
crossterm = "0.29.0"
getrandom = "0.2"
notify = "8"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.0"
tiny_http = "0.12"

[dev-dependencies]
insta = "1.47"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
